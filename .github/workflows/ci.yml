name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [ "main", "feat/**", "fix/**", "update/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── JOB 1: Build y tests (todas las ramas) ──────────────────────────────────
  build:
    name: Build y tests con H2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Tests corren con H2 — no dependen del RDS Oracle
      - name: Ejecutar tests
        run: ./mvnw test -Dspring.profiles.active=test

      - name: Compilar JAR
        run: ./mvnw package -DskipTests

      # El JAR se pasa entre jobs como artefacto (evita recompilar)
      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: minimarket-jar
          path: target/minimarket-*.jar
          retention-days: 1

  # ── JOB 2: Deploy al EC2 (solo push a main) ─────────────────────────────────
  deploy:
    name: Deploy a EC2 Ubuntu
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Descargar JAR compilado
        uses: actions/download-artifact@v4
        with:
          name: minimarket-jar
          path: ./artifact

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Agregar el host a known_hosts para evitar prompt interactivo
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar JAR al EC2
        run: |
          JAR_FILE=$(ls ./artifact/minimarket-*.jar)
          scp -i ~/.ssh/deploy_key \
              "${JAR_FILE}" \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/minimarket/app-new.jar"

      - name: Activar nuevo JAR y reiniciar servicio
        run: |
          ssh -i ~/.ssh/deploy_key \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'REMOTE'
            set -e

            # Reemplazar JAR anterior de forma atómica
            sudo mv /opt/minimarket/app-new.jar /opt/minimarket/current.jar
            sudo chown minimarket:minimarket /opt/minimarket/current.jar

            # Reiniciar el servicio (systemd hace graceful shutdown)
            sudo systemctl restart minimarket

            # Esperar y verificar que arrancó correctamente
            sleep 15
            if sudo systemctl is-active --quiet minimarket; then
              echo "✅ Servicio activo"
            else
              echo "❌ El servicio no arrancó — revisa los logs:"
              sudo journalctl -u minimarket --no-pager -n 30
              exit 1
            fi
          REMOTE

      - name: Verificar endpoint de salud
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${{ secrets.EC2_HOST }}:8080/public/index" || echo "000")
          echo "HTTP status: ${HTTP_CODE}"
          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "✅ App respondiendo correctamente"
          else
            echo "⚠️  App no responde en /public/index (código ${HTTP_CODE})"
            echo "Verifica los logs: sudo journalctl -u minimarket -n 50"
          fi

spring.application.name=minimarket

# ─────────────────────────────────────────────────────────────────────────────
# Oracle DB en AWS RDS — Credenciales externalizadas en variables de entorno
# NUNCA hardcodear credenciales en este archivo ni commitearlas al repositorio.
#
# Variables requeridas en el entorno de ejecucion (EC2 / ECS / GitHub Actions):
#   AWS_RDS_ENDPOINT   → p.ej. minimarket-db.cxyz123.us-east-1.rds.amazonaws.com
#   DB_SERVICE_NAME    → p.ej. ORCL o MINIMARKETDB
#   DB_USERNAME        → usuario Oracle con permisos limitados (principio menor privilegio)
#   DB_PASSWORD        → contrasena del usuario Oracle
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@${AWS_RDS_ENDPOINT}:1521/${DB_SERVICE_NAME}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── Pool de conexiones HikariCP ───────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# update: aplica cambios de esquema sin borrar datos. Usar 'validate' en produccion estable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita problemas de lazy loading fuera de transaccion
spring.jpa.open-in-view=false

# ── Seguridad — Spring Security ───────────────────────────────────────────────
# Perfil por defecto para test de autenticacion (solo desarrollo local):
# spring.security.user.name=admin
# spring.security.user.password=admin123
# NOTA: En produccion los usuarios provienen de Oracle DB via CustomUserDetailsService.

# ── Consola H2 — DESHABILITADA en produccion ─────────────────────────────────
spring.h2.console.enabled=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.minimarket=INFO
